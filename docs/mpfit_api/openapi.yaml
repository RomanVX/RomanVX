  /v2/orders/{order_id}/labels:
    post:
      tags:
        - Заказы на отгрузку
      summary: Метод позволяет загрузить транспортную этикетку заказа
      description: >
        Загружает файл транспортной этикетки для заказа, созданного с типом отгрузки push-FBS.<br><br>
        В отличие от `/v1/orders/{order_id}/labels`, который лишь дописывает ссылку в примечание,
        этот метод сохраняет саму этикетку: после загрузки её печатает кладовщик при сборке заказа.<br><br>
        Многостраничный PDF разбивается на страницы: каждая страница становится отдельной этикеткой.
        Страниц в файле должно быть не больше 10.<br><br>
        Повторная загрузка перезаписывает ранее загруженный файл. Этикетки страниц, которых нет
        в новом файле, удаляются — кроме тех, что уже попали в задание на печать.
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
          description: Идентификатор заказа
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Файл этикетки в формате PDF. Размер до 10 МБ, страниц не больше 10
      responses:
        '200':
          description: Возвращается в случае успеха
        '400':
          $ref: "#/components/responses/Message"
        '401':
          $ref: "#/components/responses/Message"
        '403':
          $ref: "#/components/responses/Message"
        '404':
          $ref: "#/components/responses/Message"
        '422':
          $ref: "#/components/responses/Message"
        '429':
          $ref: "#/components/responses/Message"
        '500':
          $ref: "#/components/responses/Message"
  /v1/orders/{order_id}:
    get:
      tags:
        - Заказы на отгрузку
      summary: Просмотр заказа на отгрузку
      description: >
        Метод позволяет получить информацию о заказе на отгрузку.
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
          description: Идентификатор заказа
      responses:
        '200':
          description: >-
            Свойство source определяет источник заказа. Может принимать следующие значения:<br><br>
            `MPFIT` - создан в MPFit<br><br>
            `OZON` - импортирован с маркетплейса Озон<br><br>
            `WB` - импортирован с маркетплейса Wildberries<br><br>
            `YM` - импортирован с маркетплейса Яндекс Маркет<br><br>
            `MM` - импортирован с маркетплейса Мегамаркет<br><br>
            `LEMANAPRO` - импортирован с маркетплейса Лемана ПРО<br><br><br>

            Статус заказа:<br><br>
            `NEW` - новый<br><br>
            `PRODUCTS_RESERVED` - весь товар в заказе зарезервирован<br><br>
            `EQUIPMENT` - передан в комплектацию<br><br>
            `READY_TO_SHIP` - готов к отгрузке<br><br>
            `SHIPPED` - отгружен<br><br>
            `DELIVERY` - в доставке<br><br>
            `COMPLETE` - завершен<br><br>
            `REJECT` - отмена клиентом<br><br>
            `CANCEL` - отмена поставщиком<br><br>
            `ARCHIVE` - в архиве<br><br><br>

            Статус заказа на стороне маркетплейса возвращается в поле `marketplace_status` сырым кодом маркетплейса, его название на русском - в `marketplace_status_name`. Оба поля равны `null` у заказов, созданных в MPFit. Перечень кодов задаёт сам маркетплейс, MPFit передаёт их без изменений.<br><br>
          content:
            application/json:
              schema:
                example: { "result": { "id": 1,"number": "1666552413","company_id": 1,"source": "WB","status": "NEW","marketplace_status": "canceled","marketplace_status_name": "Отменено","marketplace_supplier_status": "confirm","marketplace_substatus": null,"shipment_date": "2024-05-02T13:33:28.000000Z", "shipment_date_actual": "2024-05-02T13:33:28.000000Z","created_at": "2024-05-01T13:33:28.000000Z","updated_at": "2024-05-01T13:34:04.000000Z","note": "string","items": [ { "id": 1,"quantity": 1,"note": "string","product": { "id": 1,"article": "BSD0016","name": "Мультидиск 30см Mini, мятный и синий","width": 300,"length": 300,"height": 150,"gross": 500 },"order_item_services": [ { "id": 1,"price": 10,"cost_price": 10,"service": { "id": 1,"name": "Сборка","price_type": "piece_prices","note": "Сборка" } } ] },{ "id": 2,"quantity": 1,"note": null,"product": { "id": null,"article": null,"name": null,"width": null,"length": null,"height": null,"gross": null },"order_item_services": [] } ],"order_services": [ { "id": 1,"price": 10,"cost_price": 10,"count": 1,"service": { "id": 1,"name": "Сборка","price_type": "piece_prices","note": "Сборка" } } ],"wb_supply_name": "WB-GI-111111111", "supply_name": "22.05 13:06","packaging_type": null,"packaging_quantity": null } }
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: int64
                        description: Идентификатор заказа
                      number:
                        type: string
                        maxLength: 255
                        description: Номер заказа
                      company_id:
                        type: integer
                        format: int64
                        description: Идентификатор компании
                      source:
                        type: string
                        enum:
                          - MPFIT
                          - OZON
                          - WB
                          - YM
                          - MM
                          - LEMANAPRO
                        description: Символьный код определяющий источник заказа
                      status:
                        type: string
                        enum:
                          - NEW
                          - PRODUCTS_RESERVED
                          - EQUIPMENT
                          - READY_TO_SHIP
                          - SHIPPED
                          - DELIVERY
                          - COMPLETE
                          - REJECT
                          - CANCEL
                          - ARCHIVE
                        description: Статус заказа
                      marketplace_status:
                        type: string
                        nullable: true
                        description: >
                          Статус заказа на стороне маркетплейса, символьный код маркетплейса.
                          `null` у заказов, созданных в MPFit, и у маркетплейсов, по которым
                          статус не передаётся.
                      marketplace_status_name:
                        type: string
                        nullable: true
                        description: >
                          Название статуса маркетплейса на русском. `null`, если код статуса
                          неизвестен MPFit - сам код при этом возвращается в `marketplace_status`.
                      marketplace_supplier_status:
                        type: string
                        nullable: true
                        description: >
                          Статус заказа на стороне продавца, заполняется только для Wildberries.
