openapi: 3.0.3
info:
  title: Документация для разработчиков
  description: >
    <h2>Авторизация</h2>
    <p>Для авторизации используется Bearer-токен. Добавляйте токен в заголовок запроса Authorization.</p>
    <p>
      Пример:
      <code>Authorization: Bearer 1|9eLn13rIUzszR1d1HTs8dXOq2hfhi49MosJj08gha2e2Ff57</code>
    </p>
    <p>В МПФИТ есть 2 типа компаний:</p>
    <ul>
      <li>Фулфилмент, компания со складом, обрабатывает заказы селлеров</li>
      <li>Селлер - компания без склада</li>
    </ul>
    <p>Для компании каждого типа можно выпустить токен.</p>
    <p>У компании с типом Фулфилмент будет доступ ко всей информации своих селлеров. Получить токены можно обратившись в поддержку.</p>
    <p>Максимальное кол-во запросов в минуту указано в заголовке X-RateLimit-Limit и равно 120 для всех методов. Текущий лимит по запросам указан в заголовке X-RateLimit-Remaining.</p>
    <h2>Курсорная пагинация</h2>
    <p><code>last_id</code> - идентификатор последнего значения на странице. При выполнении первого запроса должен равняться 0. Для получения следующей страницы используйте числовой <code>last_id</code> из предыдущей непустой страницы.</p>
    <p>Выборка считается завершенной, если <code>result.data.length &lt; limit</code>. Значение <code>last_id: null</code> возвращается, если страница пуста. Не передавайте <code>null</code> в следующий запрос. Если <code>result.data.length === limit</code>, можно выполнить ещё один запрос. Он может вернуть пустую страницу.</p>
    <p><code>last_id</code> используется для перехода между страницами и не позволяет получить изменения записей, идентификаторы которых уже были пройдены. Для повторного получения актуальных данных начните с <code>last_id: 0</code>.</p>
  version: 1.4.0
servers:
  - url: 'https://app.mpfit.ru/api'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    CursorLastIdRequest:
      type: integer
      format: int64
      minimum: 0
      description: >
        Идентификатор последнего значения на странице. При выполнении первого запроса должен равняться 0.
        Для получения следующей страницы используйте числовой last_id из предыдущей непустой страницы.
    CursorLastIdResponse:
      type: integer
      format: int64
      nullable: true
      description: >
        Идентификатор последнего значения на странице.
        Если data пуст, равен null.
    CommonRequest:
      example: { "limit": 200,"last_id": 0,"filter": { "ids": [ 1 ] } }
      type: object
      required:
        - limit
        - last_id
      properties:
        limit:
          description: Кол-во элементов в ответе
          type: integer
          minimum: 1
          maximum: 200
        last_id:
          $ref: "#/components/schemas/CursorLastIdRequest"
        filter:
          type: object
          properties:
            company_id:
              description: Идентификатор компании для которой нужно получить данные, если не указан то возвращаются элементы компании для которой был выпущен токен
              type: integer
              minimum: 1
              nullable: true
            ids:
              description: Идентификаторы сущностей. Если в массиве будет указан id сущности к которой у токена нет доступа, то id будет проигнорирован без предупреждения.
              type: array
              items:
                type: integer
                format: int64
    CommonRequest_2:
      example: { "limit": 200, "last_id": 0 }
      type: object
      required:
        - limit
        - last_id
      properties:
        limit:
          description: Кол-во элементов в ответе
          type: integer
          minimum: 1
          maximum: 200
        last_id:
          $ref: "#/components/schemas/CursorLastIdRequest"
        filter:
          type: object
          properties:
            company_id:
              description: Идентификатор компании для которой нужно получить данные, если не указан то возвращаются элементы всех доступных токену компаний
              type: integer
              minimum: 1
              nullable: true
  responses:
    Message:
      description: ''
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: Описание ошибки
    ResultResponse:
      description: ''
      content:
        application/json:
          schema:
            type: object
            properties:
              is_success:
                type: boolean
                description: Равен true если запрос выполнен успешно
              errors:
                type: array
                description: Массив с ошибками, пуст если запрос выполнен успешно
                items:
                  type: object
                  properties:
                    message:
                      type: string
                      description: Описание ошибки
security:
  - bearerAuth: [ ]
tags:
  - name: Каталог
  - name: Склад
  - name: Заказы на приемку
  - name: Заказы на отгрузку
  - name: КИЗ
  - name: Компании
  - name: Счета
  - name: Услуги
  - name: Аналитика
paths:
  /v1/services/list:
    post:
      tags:
        - Услуги
      summary: Список услуг
      description: >
        Метод доступен только для компаний с типом 'фулфилмент'.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              example: { "limit": 200,"last_id": 0,"filter": { "ids": [ 1 ] } }
              type: object
              required:
                - limit
                - last_id
              properties:
                limit:
                  description: Кол-во элементов в ответе
                  type: integer
                  minimum: 1
                  maximum: 200
                last_id:
                  $ref: "#/components/schemas/CursorLastIdRequest"
                filter:
                  type: object
                  properties:
                    ids:
                      description: Идентификаторы сущностей. Если в массиве будет указан id сущности к которой у токена нет доступа, то id будет проигнорирован без предупреждения.
                      type: array
                      items:
                        type: integer
                        format: int64
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                example: { "result": { "data": [ { "id": 1, "name": "Проверить на брак", "serviceType": "product", "stages": ["Приёмка", "Размещение", "Обработка", "Контроль", "Отгрузка"], "note": "note", "priceType": "piece_prices", "servicePrices": {"basePrice": [1000, 800, 600, 400], "costPrice": [900, 700, 500, 300], "salaryPrice": [700, 500, 300, 200]}, "companyPrices": [{"companyId": 1, "companyName": "ООО «Компания»", "pieceCompanyPriceFirst": 800, "pieceCompanyPriceSecond": 700, "pieceCompanyPriceThird": 600, "pieceCompanyPriceFourth": 500}], "consumables": [{"id": 1811694, "name": "гофрокороб 260*120*120"}], "isLimitVisibility": false, "duration": {"first": 88, "second": 88, "third": 83, "fourth": 99}, "isAutoAttach": false, "autoAttachQuantity": null, "orderTypeNames": ["OZON - FBO", "WB - FBO"], "storeProductCategoryIds": [1, 2, 3], "quantityRanges": {"first_end": 10, "second_end": 100, "third_end": 1000} } ], "total": 1, "last_id": 1 }}
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      data:
                        type: array
                        description: Список услуг
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              format: int64
                              description: Уникальный идентификатор услуги
                            name:
                              type: string
                              description: Название услуги
                            serviceType:
                              description: >
                                Тип услуги:<br>
                                  * `product` - услуга для товаров<br><br>
                                  * `order` - услуга для заказов<br><br>
                                  * `default` - услуга по умолчанию
                              type: string
                              enum:
                                - product
                                - order
                                - default
                            stages:
                              description: Названия этапов склада, на которых применяется услуга
                              type: array
                              items:
                                type: string
                            note:
                              type: string
                              nullable: true
                              description: Примечание к услуге
                            priceType:
                              description: Тип цены услуги:<br>
                                * `piece_prices` - цена за единицу
                                * `volume_prices` - цена за объем
                              type: string
                              enum:
                                - piece_prices
                                - volume_prices
                            servicePrices:
                              description: Цены услуги в копейках. Структура зависит от serviceType и priceType
                              oneOf:
                                - type: object
                                  description: Цена за 1м3 для услуг с типом отличным от default и priceType равным volume_prices
                                  properties:
                                    volumeBasePrice:
                                      type: integer
                                      description: Базовая цена
                                    volumeCostPrice:
                                      type: integer
                                      description: Себестоимость
                                    volumeSalaryPrice:
                                      type: integer
                                      description: Зарплата
                                - type: object
                                  description: Цена за шт по интервалам (quantityRanges) для услуг с типом отличным от default и priceType равным piece_prices
                                  properties:
                                    basePrice:
                                      type: array
                                      description: Базовая цена
                                      items:
                                        type: integer
                                      minItems: 4
                                      maxItems: 4
                                    costPrice:
                                      type: array
                                      description: Себестоимость
                                      items:
                                        type: integer
                                      minItems: 4
                                      maxItems: 4
                                    salaryPrice:
                                      type: array
                                      description: Зарплата
                                      items:
                                        type: integer
                                      minItems: 4
                                      maxItems: 4
                                - type: object
                                  description: Для услуг с типом default
                                  properties:
                                    freeVolumePrice:
                                      type: integer
                                      description: Цена за 1м3 свободного объема.
                                    bookedVolumePrice:
                                      type: integer
                                      description: Цена за 1м3 забронированного объема.
                            companyPrices:
                              description: Индивидуальные цены для компаний в копейках. Структура зависит от serviceType и priceType.
                              type: array
                              nullable: true
                              items:
                                oneOf:
                                  - type: object
                                    description: Цена за 1м3 для услуг с типом отличным от default и priceType равным volume_prices
                                    properties:
                                      companyId:
                                        type: integer
                                        description: Уникальный идентификатор компании
                                      companyName:
                                        type: string
                                        description: Название компании
                                      volumeCompanyPrice:
                                        type: integer
                                        description: Базовая цена                                      
                                  - type: object
                                    description: Цена за шт. по интервалам (quantityRanges) для услуг с типом отличным от default и priceType равным piece_prices
                                    properties:
                                      companyId:
                                        type: integer
                                        description: Уникальный идентификатор компании
                                      companyName:
                                        type: string
                                        description: Название компании
                                      pieceCompanyPriceFirst:
                                        type: integer
                                        description: Базовая цена для первого интервала
                                      pieceCompanyPriceSecond:
                                        type: integer
                                        description: Базовая цена для второго интервала
                                      pieceCompanyPriceThird:
                                        type: integer
                                        description: Базовая цена для третьего интервала
                                      pieceCompanyPriceFourth:
                                        type: integer
                                        description: Базовая цена для четвертого интервала
                                  - type: object
                                    description: Для услуг с типом default
                                    properties:
                                      companyId:
                                        type: integer
                                        description: Уникальный идентификатор компании
                                      companyName:
                                        type: string
                                        description: Название компании
                                      freeVolumePrice:
                                        type: integer
                                        description: Цена за 1м3 свободного объема
                                      bookedVolumePrice:
                                        type: integer
                                        description: Цена за 1м3 забронированного объема
                                      freeStorageDays:
                                        type: integer
                                        description: Бесплатное хранение в днях. Только для базовой услуги хранения товара
                            consumables:
                              type: array
                              nullable: true
                              description: Расходники
                              items:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                    description: Уникальный идентификатор товара
                                  name:
                                    type: string
                                    description: Название товара
                            isLimitVisibility:
                              type: boolean
                              description: Признак индивидуальной услуги
                            duration:
                              type: object
                              nullable: true
                              description: Время оказания услуги, сек
                              properties:
                                first:
                                  type: integer
                                  description: Для первого интервала
                                second:
                                  type: integer
                                  description: Для второго интервала
                                third:
                                  type: integer
                                  description: Для третьего интервала
                                fourth:
                                  type: integer
                                  description: Для четвертого интервала
                            isAutoAttach:
                              type: boolean
                              description: Признак автоуслуги
                            autoAttachQuantity:
                              type: integer
                              nullable: true
                              description: Количество для автоуслуги. Для услуг с serviceType отличным от order всегда null
                            orderTypeNames:
                              type: array
                              nullable: true
                              description: Названия мест назначений
                              items:
                                type: string
                            storeProductCategoryIds:
                              type: array
                              nullable: true
                              description: Идентификаторы категорий товаров (только для услуг к товарам)
                              items:
                                type: integer
                                format: int64
                            freeStorageDays:
                              type: integer
                              nullable: true
                              description: Бесплатное хранение в днях. Только для услуги по умолчанию "Хранение товара"                            
                            method:
                              description: Метод расчета услуги по умолчанию "Хранение товара":<br>
                                * `FIFO` - По объему товара (FIFO)<br>
                                * `LIFO` - По объему товара (LIFO)<br>
                                * `BY_VOLUME` - По объёму товара + по объёму ячейки
                              type: string
                              enum:
                                - FIFO
                                - LIFO
                                - BY_VOLUME
                            quantityRanges:
                              description: Интервал цен. Только для услуг с priceType равным piece_prices
                              type: object
                              properties:
                                first_end:
                                  type: integer
                                  description: конец первого интервала
                                second_end:
                                  type: integer
                                  description: конец второго интервала
                                third_end:
                                  type: integer
                                  description: конец третьего интервала
                      total:
                        type: integer
                        description: Кол-во услуг в свойстве data
                      last_id:
                        $ref: "#/components/schemas/CursorLastIdResponse"
        '401':
          $ref: "#/components/responses/Message"
        '403':
          $ref: "#/components/responses/Message"
        '422':
          $ref: "#/components/responses/Message"
        '429':
          $ref: "#/components/responses/Message"
        '500':
          $ref: "#/components/responses/Message"
  /v1/products/list:
    post:
      tags:
        - Каталог
      summary: Список товаров
      description: >
        Метод позволяет получить список товаров в каталоге
      requestBody:
        required: true
        content:
          application/json:
            schema:
              example: { "limit": 200,"last_id": 0,"filter": { "barcode": "4609999000111" } }
              type: object
              required:
                - limit
                - last_id
              properties:
                limit:
                  description: Кол-во элементов в ответе
                  type: integer
                  minimum: 1
                  maximum: 200
                last_id:
                  type: integer
                  format: int64
                  minimum: 0
                  description: Идентификатор полученный в предыдущем запросе. При первом запросе должен равняться 0
                filter:
                  type: object
                  properties:
                    company_id:
                      description: Идентификатор компании для которой нужно получить данные, если не указан то возвращаются элементы компании для которой был выпущен токен
                      type: integer
                      minimum: 1
                      nullable: true
                    ids:
                      description: Идентификаторы сущностей. Если в массиве будет указан id сущности к которой у токена нет доступа, то id будет проигнорирован без предупреждения.
                      type: array
                      items:
                        type: integer
                        format: int64
                    barcode:
                      description: Штрихкод товара, точное совпадение (поиск по части штрихкода не поддерживается). Ищет и в штрихкодах товара, и во внешних штрихкодах (Wildberries, Ozon, Яндекс Маркет, Uzum). Внешние штрихкоды хранятся длиной до 30 символов — значение длиннее ищется только среди собственных штрихкодов товара. Пробелы по краям обрезаются. Поиск идёт по всем компаниям, доступным токену, а если передан filter.company_id — только по ней. Чтобы не фильтровать по штрихкоду, не передавайте поле — пустая строка и null дают 422, а не выдачу всего каталога. Фильтры складываются по И, поэтому barcode вместе с ids вернёт только товары, попавшие под оба условия. Когда совпадений нет, data пустой, а last_id равен null — в следующем запросе используйте свой прежний last_id.
                      type: string
                      minLength: 1
                      maxLength: 40
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                example: { "result": { "data": [ { "id": 1,"company_id": 1,"article": "02120623-0767","name": "Чашка для супа Сабина Сине-золотая лента (0.3 л) с блюдцами Leander","barcodes": ["1234124","3251252"],"external_barcodes": {"wb":["2000000000011", "2000000999999"],"ozon":["OZN-12345"],"yandex_market":["23r345"],"uzum":["213546"]},"size": "46","width": 100,"length": 150,"height": 80,"gross": 350,"brand": "Leander","stock_state": "NORMAL","img": "https://some-site/1.jpg","product_type": "SIMPLE","smart_items": null,"created_at": "2024-05-07T07:21:48.603Z","updated_at": "2024-05-07T07:21:48.603Z" }, { "id": 42,"company_id": 1,"article": "02120623-SMART","name": "Набор посуды","barcodes": [],"external_barcodes": {},"size": null,"width": null,"length": null,"height": null,"gross": null,"brand": null,"stock_state": "NORMAL","img": null,"product_type": "SMART","smart_items": [ { "product_id": 1,"quantity": 2 },{ "product_id": 5,"quantity": 1 } ],"created_at": "2024-05-07T07:21:48.603Z","updated_at": "2024-05-07T07:21:48.603Z" } ],"total": 2,"last_id": 42 } }
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      data:
                        type: array
                        description: Список товаров
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              format: int64
                              description: Уникальный идентификатор товара
                            company_id:
                              type: integer
                              format: int64
                              description: Идентификатор компании
                            article:
                              type: string
                              maxLength: 200
                              description: Артикул
                            name:
                              type: string
                              maxLength: 1000
                              description: Название товара
                            barcodes:
                              type: array
                              description: Штрихкоды
                              items:
                                type: string
                                description: штрихкод
                            external_barcodes:
                              type: object
                              description: Баркоды по маркетплейсам
                              properties:
                                wb:
                                  type: array
                                  nullable: true
                                  description: Wildberries баркоды
                                  items:
                                    type: string
                                    description: Баркод Wildberries
                                ozon:
                                  type: array
                                  nullable: true
                                  description: Ozon баркоды
                                  items:
                                    type: string
                                    description: Баркод Ozon
                                yandex_market:
                                  type: array
                                  nullable: true
                                  description: ЯндексМаркет баркоды
                                  items:
                                    type: string
                                    description: Баркод ЯндексМаркет
                                uzum:
                                  type: array
                                  nullable: true
                                  description: Uzum баркоды
                                  items:
                                    type: string
                                    description: Баркод Uzum
                            size:
                              type: string
                              nullable: true
                              description: размер
                            width:
                              type: integer
                              nullable: true
                              description: >
                                Ширина в мм. `null` — не заполнено. У товаров, созданных через API
                                без габаритов, вместо `null` может лежать `0` (унаследованное
                                поведение создания товара).
                            length:
                              type: integer
                              nullable: true
                              description: >
                                Длина в мм. `null` — не заполнено. У товаров, созданных через API
                                без габаритов, вместо `null` может лежать `0` (унаследованное
                                поведение создания товара).
                            height:
                              type: integer
                              nullable: true
                              description: >
                                Высота в мм. `null` — не заполнено. У товаров, созданных через API
                                без габаритов, вместо `null` может лежать `0` (унаследованное
                                поведение создания товара).
                            gross:
                              type: integer
                              nullable: true
                              description: Вес с упаковкой в граммах. `null` — не заполнено.
                            brand:
                              type: string
                              maxLength: 100
                              nullable: true
                              description: >
                                Название бренда в каноническом написании из общего справочника брендов:
                                регистр и лишние пробелы нормализуются, поэтому значение может отличаться от
                                переданного в `brand` при создании товара. `null` — бренд не указан.
                            stock_state:
                              type: string
                              enum:
                                - NORMAL
                                - PROCESSING
                                - DEFECT
                              description: >
                                Состояние товара на складе:<br>
                                  * `NORMAL` - продажа<br><br>
                                  * `PROCESSING` - подготовка<br><br>
                                  * `DEFECT` - брак
                            img:
                              type: string
                              maxLength: 500
                              nullable: true
                              description: >
                                Адрес ссылки на изображение товара — в том виде, в котором он сохранён
                                (фото из карточки маркетплейса, загруженное в МПФИТ или переданное в `img`
                                при создании через API). Изменить через API нельзя. `null` — не заполнено.
                            product_type:
                              type: string
                              enum:
                                - SIMPLE
                                - SMART
                                - PACKAGE (PIECE)
                              description: >
                                Тип товара:<br>
                                  * `SIMPLE` - обычный товар<br><br>
                                  * `SMART` - смарт-товар (набор)<br><br>
                                  * `PACKAGE (PIECE)` - упаковка (штучная), расходник
                            smart_items:
                              type: array
                              nullable: true
                              description: Список товаров в смарт-товаре. Только для `SMART` - массив составляющих, для остальных типов - `null`
                              items:
                                type: object
                                required:
                                  - product_id
                                  - quantity
                                properties:
                                  product_id:
                                    type: integer
                                    format: int64
                                    minimum: 1
                                    description: Идентификатор товара
                                  quantity:
                                    type: integer
                                    minimum: 1
                                    description: Количество
                            created_at:
                              type: string
                              format: date-time
                              description: Дата создания товара
                            updated_at:
                              type: string
                              format: date-time
                              description: Дата обновления товара
                      total:
                        type: integer
                        description: Кол-во товаров в свойстве data
                      last_id:
                        $ref: "#/components/schemas/CursorLastIdResponse"
        '401':
          $ref: "#/components/responses/Message"
        '403':
          $ref: "#/components/responses/Message"
        '422':
          $ref: "#/components/responses/Message"
        '429':
          $ref: "#/components/responses/Message"
        '500':
          $ref: "#/components/responses/Message"
  /v1/products/create:
    post:
      tags:
        - Каталог
      summary: Создание товаров
      description: >
        Товары создаются с категорией "Стандарт". <br>
        Если передан smart_items, то создается смарт-товар.
        <br>Одним запросом можно создать максимум 100 товаров
      requestBody:
        required: true
        content:
          application/json:
            schema:
              example: { "products": [ { "article": "02120623-G003GR","name": "Умные часы","brand": "Chronos Quantum","excise": true,"company_id": 1,"height": 1000,"length": 100,"width": 99,"multiplicity": 3,"size": "XXL","colour": "белый","composition": "хлопок 80%, полиамид 20%","code_1c": "abcABC123","cost_price": 99,"img": "https://some-site/1.jpg","smart_items": [ { "product_id": 1,"quantity": 1 } ],"product_barcodes": ["4601234567890","4601234567891"],"external_barcodes": { "wb": ["2000000000011"],"ozon": ["OZN-12345"],"yandex_market": ["YM-998877"],"uzum": ["UZ-112233"] } } ] }
              type: object
              required:
                - products
              properties:
                products:
                  type: array
                  items:
                    type: object
                    required:
                      - article
                      - name
                    properties:
                      article:
                        type: string
                        minLength: 2
                        maxLength: 200
                        description: Артикул товара
                      name:
                        type: string
                        minLength: 2
                        maxLength: 500
                        description: Название товара
                      extId:
                        type: string
                        nullable: true
                        maxLength: 255
                        description: Уникальный идентификатор товара в вашей системе. Нельзя назначить один и тот же идентификатор более чем одному товару
                      brand:
                        type: string
                        minLength: 2
                        maxLength: 100
                        nullable: true
                        description: Бренд (производитель) товара
                      excise:
                        type: boolean
                        nullable: true
                        description: Киз/Акциз. Если не указан, то используется false
                      company_id:
                        type: integer
                        format: int64
                        nullable: true
                        description: Идентификатор компании, если не указан то используется id компании для которой выпущен токен
                      height:
                        type: integer
                        maximum: 999999
                        nullable: true
                        description: Высота в мм.
                      length:
                        type: integer
                        maximum: 999999
                        nullable: true
                        description: Длина в мм.
                      width:
                        type: integer
                        maximum: 999999
                        nullable: true
                        description: Ширина в мм.
                      multiplicity:
                        type: integer
                        minimum: 1
                        maximum: 100000
                        nullable: true
                        description: Кратность короба.
                      size:
                        type: string
                        maxLength: 255
                        nullable: true
                        description: Размер
                      colour:
                        type: string
                        maxLength: 255
                        nullable: true
                        description: Цвет
                      composition:
                        type: string
                        minLength: 2
                        maxLength: 1000
                        nullable: true
                        description: Состав
                      code_1c:
                        type: string
                        maxLength: 30
                        nullable: true
                        pattern: '^[a-zA-Z0-9]{1,30}$'
                        description: Код 1С
                      cost_price:
                        type: integer
                        minimum: 0
                        maximum: 9999999999
                        nullable: true
                        description: Стоимость
                      img:
                        type: string
                        maxLength: 500
                        nullable: true
                        description: >
                          Адрес ссылки на изображение: абсолютный URL до 500 символов, домен должен
                          существовать (проверяется DNS-запросом). Задаётся только при создании товара.
                      smart_items:
                        type: array
                        nullable: true
                        description: Список товаров в смарт-товаре
                        items:
                          type: object
                          required:
                            - product_id
                            - quantity
                          properties:
                            product_id:
                              type: integer
                              format: int64
                              minimum: 1
                              description: Идентификатор товара
                            quantity:
                              type: integer
                              minimum: 1
                              description: Количество
                      product_barcodes:
                        type: array
                        nullable: true
                        description: Штрихкоды товара
                        items:
                          type: string
                          minLength: 1
                          maxLength: 40
                          description: Штрихкод
                      external_barcodes:
                        type: object
                        nullable: true
                        description: Баркоды по маркетплейсам
                        properties:
                          wb:
                            type: array
                            nullable: true
                            description: Wildberries баркоды
                            items:
                              type: string
                              minLength: 1
                              maxLength: 30
                              description: Баркод Wildberries
                          ozon:
                            type: array
                            nullable: true
                            description: Ozon баркоды
                            items:
                              type: string
                              minLength: 1
                              maxLength: 30
                              description: Баркод Ozon
                          yandex_market:
                            type: array
                            nullable: true
                            description: ЯндексМаркет баркоды
                            items:
                              type: string
                              minLength: 1
                              maxLength: 30
                              description: Баркод ЯндексМаркет
                          uzum:
                            type: array
                            nullable: true
                            description: Uzum баркоды
                            items:
                              type: string
                              minLength: 1
                              maxLength: 30
                              description: Баркод Uzum
      responses:
        '201':
          description: Ответ
          content:
            application/json:
              schema:
                example: { "products": [ { "id": 1, "extId": 'qwe', "article": "asd" } ] }
                type: object
                properties:
                  products:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                          description: Идентификатор созданного товара
                        extId:
                          type: string
                          nullable: true
                          description: Уникальный идентификатор товара в вашей системе
                        article:
                          type: string
                          description: Артикул созданного товара
        '401':
          $ref: "#/components/responses/Message"
        '403':
          $ref: "#/components/responses/Message"
        '422':
          $ref: "#/components/responses/Message"
        '429':
          $ref: "#/components/responses/Message"
        '500':
          $ref: "#/components/responses/Message"
  /v1/products/update-barcodes:
    post:
      tags:
        - Каталог
      summary: Обновление штрихкодов товаров
      description: >
        Массовое обновление штрихкодов для товаров. <br>
        Полностью заменяет существующие штрихкоды на новые. <br>
        Одним запросом можно обновить максимум 100 товаров.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              example: { "products": [ { "product_id": 12345, "barcodes": ["4601234567890", "4601234567891"] }, { "product_id": 12346, "barcodes": [] } ] }
              type: object
              required:
                - products
              properties:
                products:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required:
                      - product_id
                    properties:
                      product_id:
                        type: integer
                        format: int64
                        minimum: 1
                        description: Идентификатор товара
                      barcodes:
                        type: array
                        nullable: true
                        description: Массив штрихкодов товара. Если пустой массив, то все существующие штрихкоды будут удалены
                        items:
                          type: string
                          minLength: 1
                          maxLength: 40
                          description: Штрихкод
      responses:
        '200':
          description: Ответ
          content:
            application/json:
              schema:
                example: { "result": [ { "product_id": 12345, "updated": true, "error": null }, { "product_id": 12346, "updated": false, "error": "Нет доступа к товару" } ] }
                type: object
                properties:
                  result:
                    type: array
                    description: Массив результатов обработки
                    items:
                      type: object
                      properties:
                        product_id:
                          type: integer
                          format: int64
                          description: Идентификатор товара
                        updated:
                          type: boolean
                          description: true - штрихкоды обновлены, false - ошибка
                        error:
                          type: string
                          nullable: true
                          description: null если успешно, текст ошибки если не удалось обновить
        '401':
          $ref: "#/components/responses/Message"
        '403':
          $ref: "#/components/responses/Message"
        '422':
          $ref: "#/components/responses/Message"
        '429':
          $ref: "#/components/responses/Message"
        '500':
          $ref: "#/components/responses/Message"
  /v1/products/stocks:
    post:
      tags:
        - Склад
      summary: Просмотр остатков
      description: >
        Метод позволяет получить складские остатки по товарам.<br><br>
        Остатки товара могут измениться после того, как его идентификатор уже был пройден. Для повторного получения актуальных остатков начните с `last_id: 0`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              example: { "limit": 200,"last_id": 0,"filter": { "barcode": "4609999000111" } }
              type: object
              required:
                - limit
                - last_id
              properties:
                limit:
                  description: Кол-во элементов в ответе
                  type: integer
                  minimum: 1
                  maximum: 200
                last_id:
                  type: integer
                  format: int64
                  minimum: 0
                  description: Идентификатор полученный в предыдущем запросе. При первом запросе должен равняться 0
                filter:
                  type: object
                  properties:
                    company_id:
                      description: Идентификатор компании для которой нужно получить данные, если не указан то возвращаются элементы компании для которой был выпущен токен
                      type: integer
                      minimum: 1
                      nullable: true
                    ids:
                      description: Идентификаторы сущностей. Если в массиве будет указан id сущности к которой у токена нет доступа, то id будет проигнорирован без предупреждения.
                      type: array
                      items:
                        type: integer
                        format: int64
                    barcode:
                      description: Штрихкод товара, точное совпадение (поиск по части штрихкода не поддерживается). Ищет и в штрихкодах товара, и во внешних штрихкодах (Wildberries, Ozon, Яндекс Маркет, Uzum). Внешние штрихкоды хранятся длиной до 30 символов — значение длиннее ищется только среди собственных штрихкодов товара. Пробелы по краям обрезаются. Поиск идёт по всем компаниям, доступным токену, а если передан filter.company_id — только по ней. Чтобы не фильтровать по штрихкоду, не передавайте поле — пустая строка и null дают 422, а не выдачу всего каталога. Фильтры складываются по И, поэтому barcode вместе с ids вернёт только товары, попавшие под оба условия. Когда совпадений нет, data пустой, а last_id равен null — в следующем запросе используйте свой прежний last_id.
                      type: string
                      minLength: 1
                      maxLength: 40
      responses:
        '200':
          description: Ответ
          content:
            application/json:
              schema:
                example: { "result": { "data": [ { "product_id": 1,"article": "article", "company_id": 1,"stocks": [ { "warehouse_id": 1,"free": 1,"booked": 0,"can_collect": 0 } ] } ],"total": 1,"last_id": 1 } }
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            product_id:
                              type: integer
                              format: int64
                              description: Уникальный идентификатор товара
                            article:
                              type: string
                              description: Артикул товара
                            company_id:
                              type: integer
                              format: int64
                              description: Идентификатор компании, которой принадлежит товар
                            stocks:
                              type: object
                              properties:
                                warehouse_id:
                                  type: integer
                                  description: Идентификатор склада
                                free:
                                  type: integer
                                  description: Кол-во незабронированного товара
                                booked:
                                  type: integer
                                  description: Кол-во забронированного товара (включая не размещённое в ячейке)
                                can_collect:
                                  type: integer
                                  description: Кол-во товара которое можно собрать. В случае если товар является Смарт-товаром (набором)
                      total:
                        type: integer
                        description: Кол-во элементов в свойстве data
                      last_id:
                        $ref: "#/components/schemas/CursorLastIdResponse"
        '401':
          $ref: "#/components/responses/Message"
        '403':
          $ref: "#/components/responses/Message"
        '422':
          $ref: "#/components/responses/Message"
        '429':
          $ref: "#/components/responses/Message"
        '500':
          $ref: "#/components/responses/Message"
  /v1/arrivals/create:
    post:
      tags:
        - Заказы на приемку
      summary: Создание заказа на приемку
      description: >
        При создании заявки допускается добавлять товары разных компаний.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              example: { "date": "2024-06-11T09:20:06Z","items": [ { "product_id": 137538,"quantity": 152 },{ "product_id": 1,"quantity": 355 } ] }
              type: object
              required:
                - date
                - items
              properties:
                date:
                  type: string
                  format: date-time
                  description: Планируемая дата поступления заказа на склад. Не должна быть ранее даты создания заказа.
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - product_id
                      - quantity
                    properties:
                      product_id:
                        type: integer
                        format: int64
                        description: Уникальный идентификатор товара
                      quantity:
                        type: integer
                        description: Кол-во товара
      responses:
        '201':
          description: Ответ
          content:
            application/json:
              schema:
                example: { "arrival": { "id": 17047, "company_ids": [7] } }
