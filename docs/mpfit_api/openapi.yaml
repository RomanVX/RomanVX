  /v1/orders/list:
    post:
      tags:
        - Заказы на отгрузку
      summary: Заказы на отгрузку
      description: >
        Метод позволяет получить список заказов на отгрузку.<br><br>
        При фильтрации по `filter.statuses` заказ может перейти в запрошенный статус после того, как его идентификатор уже был пройден. Для повторного получения актуальной выборки начните с `last_id: 0`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              example: { "limit": 1,"last_id": 0,"filter": { "statuses": [ "NEW" ] } }
              type: object
              required:
                - limit
                - last_id
              properties:
                limit:
                  description: Кол-во элементов в ответе
                  type: integer
                  minimum: 1
                  maximum: 200
                last_id:
                  $ref: "#/components/schemas/CursorLastIdRequest"
                filter:
                  type: object
                  properties:
                    company_id:
                      description: Идентификатор компании для которой нужно получить заказы, если не указан то возвращаются заказы компании для которой был выпущен токен
                      type: integer
                      minimum: 1
                      nullable: true
                    ids:
                      description: Идентификаторы заказов
                      type: array
                      items:
                        type: integer
                        format: int64
                    statuses:
                      description: Символьные коды статусов заказа
                      type: array
                      items:
                        type: string
                        enum:
                          - NEW
                          - PRODUCTS_RESERVED
                          - EQUIPMENT
                          - READY_TO_SHIP
                          - SHIPPED
                          - DELIVERY
                          - COMPLETE
                          - REJECT
                          - CANCEL
                          - ARCHIVE
      responses:
        '200':
          description: >-
            Свойство source определяет источник заказа. Может принимать следующие значения:<br><br>
            `MPFIT` - создан в MPFit<br><br>
            `OZON` - импортирован с маркетплейса Озон<br><br>
            `WB` - импортирован с маркетплейса Wildberries<br><br>
            `YM` - импортирован с маркетплейса Яндекс Маркет<br><br>
            `MM` - импортирован с маркетплейса Мегамаркет<br><br>
            `LEMANAPRO` - импортирован с маркетплейса Лемана ПРО<br><br><br>

            Статус заказа:<br><br>
            `NEW` - новый<br><br>
            `PRODUCTS_RESERVED` - весь товар в заказе зарезервирован<br><br>
            `EQUIPMENT` - передан в комплектацию<br><br>
            `READY_TO_SHIP` - готов к отгрузке<br><br>
            `SHIPPED` - отгружен<br><br>
            `DELIVERY` - в доставке<br><br>
            `COMPLETE` - завершен<br><br>
            `REJECT` - отмена клиентом<br><br>
            `CANCEL` - отмена поставщиком<br><br>
            `ARCHIVE` - в архиве<br><br><br>

            Статус заказа на стороне маркетплейса возвращается в поле `marketplace_status` сырым кодом маркетплейса, его название на русском - в `marketplace_status_name`. Оба поля равны `null` у заказов, созданных в MPFit. Перечень кодов задаёт сам маркетплейс, MPFit передаёт их без изменений.<br><br>
          content:
            application/json:
              schema:
                example: { "result": { "data": [ { "id": 1,"number": "1666552413","company_id": 1,"source": "WB","status": "NEW","marketplace_status": "canceled","marketplace_status_name": "Отменено","marketplace_supplier_status": "confirm","marketplace_substatus": null,"shipment_date": "2024-05-02T13:33:28.000000Z","shipment_date_actual": "2024-05-02T13:33:28.000000Z","created_at": "2024-05-01T13:33:28.000000Z","updated_at": "2024-05-01T13:34:04.000000Z","items": [ { "id": 1,"quantity": 1,"product": { "id": 1,"article": "BSD0016","name": "Мультидиск 30см Mini, мятный и синий","width": 300,"length": 300,"height": 150,"gross": 500 } } ],"wb_supply_name": "WB-GI-111111111","supply_name": "22.05 13:06","order_type": "Название направления заказа на отгрузку","packaging_type": null,"packaging_quantity": null } ],"total": 1,"last_id": 1 } }
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              format: int64
                              description: Идентификатор заказа на отгрузку
                            number:
                              type: string
                              maxLength: 255
                              description: Номер заказа
                            company_id:
                              type: integer
                              format: int64
                              description: Идентификатор компании
                            source:
                              type: string
                              enum:
                                - MPFIT
                                - OZON
                                - WB
                                - YM
                                - MM
                                - LEMANAPRO
                              description: Символьный код определяющий источник заказа
                            status:
                              type: string
                              enum:
                                - NEW
                                - PRODUCTS_RESERVED
                                - EQUIPMENT
                                - READY_TO_SHIP
                                - SHIPPED
                                - DELIVERY
                                - COMPLETE
                                - REJECT
                                - CANCEL
                                - ARCHIVE
                              description: Статус заказа
                            marketplace_status:
                              type: string
                              nullable: true
                              description: >
                                Статус заказа на стороне маркетплейса, символьный код маркетплейса.
                                `null` у заказов, созданных в MPFit, и у маркетплейсов, по которым
                                статус не передаётся.
                            marketplace_status_name:
                              type: string
                              nullable: true
                              description: >
                                Название статуса маркетплейса на русском. `null`, если код статуса
                                неизвестен MPFit - сам код при этом возвращается в `marketplace_status`.
                            marketplace_supplier_status:
                              type: string
                              nullable: true
                              description: >
                                Статус заказа на стороне продавца, заполняется только для Wildberries.
                                `null`, пока Wildberries не сообщил статус.
                            marketplace_substatus:
                              type: string
                              nullable: true
                              description: >
                                Подстатус заказа на стороне маркетплейса, заполняется только для Озон
                                и Яндекс Маркета.
                            shipment_date:
                              type: string
                              format: date-time
                              description: Дата отгрузки план
                            shipment_date_actual:
                              type: string
                              format: date-time
                              description: Дата отгрузки факт
                            created_at:
                              type: string
                              format: date-time
                              description: Дата создания заказа
                            updated_at:
                              type: string
                              format: date-time
                              description: Дата обновления заказа
                            items:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                    format: int64
                                    description: Уникальный идентификатор товара в заказе
                                  quantity:
                                    type: integer
                                    description: Кол-во товара
                                  product:
                                    type: object
                                    description: >
                                      Товар в каталоге. Если товар удалён (осиротевшая позиция), объект
                                      возвращается тем же набором полей, но все они равны `null`.
                                    properties:
                                      id:
                                        type: integer
                                        format: int64
                                        nullable: true
                                        description: Уникальный идентификатор товара
                                      article:
                                        type: string
                                        nullable: true
                                        description: Артикул товара
                                      name:
                                        type: string
                                        nullable: true
                                        description: Название товара
                                      width:
                                        type: integer
                                        nullable: true
                                        description: >
                                          Ширина в мм. `null` — не заполнено (или товар удалён). У товаров,
                                          созданных через API без габаритов, вместо `null` может лежать `0`
                                          (унаследованное поведение создания товара).
                                      length:
                                        type: integer
                                        nullable: true
                                        description: >
                                          Длина в мм. `null` — не заполнено (или товар удалён). У товаров,
                                          созданных через API без габаритов, вместо `null` может лежать `0`
                                          (унаследованное поведение создания товара).
                                      height:
                                        type: integer
                                        nullable: true
                                        description: >
                                          Высота в мм. `null` — не заполнено (или товар удалён). У товаров,
                                          созданных через API без габаритов, вместо `null` может лежать `0`
                                          (унаследованное поведение создания товара).
                                      gross:
                                        type: integer
                                        nullable: true
                                        description: Вес с упаковкой в граммах. `null` — не заполнено (или товар удалён).
                            wb_supply_name:
                              type: string
                              nullable: true
                              description: Название поставки в Wildberries. Для не WB заказов всегда null.
                            supply_name:
                              type: string
                              nullable: true
                              description: Название поставки в МПФИТ. Для не WB заказов всегда null.
                            order_type:
                              type: string
                              nullable: true
                              description: Название направления заказа на отгрузку. Список всех направлений можно получить с помощью метода /v1/orders/types/list
                            packaging_type:
                              type: string
                              nullable: true
                              enum:
                                - box
                                - pallet
                                - null
                              description: >
                                Тип грузомест в заявке на отгрузку. `box` - короба, `pallet` -
                                паллеты. Заполняется только у заявок на отгрузку, собираемых
                                по FBO; у всех остальных заказов `null`.
                            packaging_quantity:
                              type: integer
                              nullable: true
                              description: >
                                Количество грузомест в заявке на отгрузку. Заполняется только
                                у заявок на отгрузку, собираемых по FBO; у всех остальных
                                заказов `null`.
                      total:
                        type: integer
                        description: Кол-во элементов в свойстве data
                      last_id:
