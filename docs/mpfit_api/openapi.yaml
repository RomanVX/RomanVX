  /v1/orders/archive:
    post:
      tags:
        - Заказы на отгрузку
      summary: Архивация заказов на отгрузку
      description: >
        Метод позволяет заархивировать один или несколько заказов на отгрузку.<br><br>
        Каждый идентификатор обрабатывается независимо. В ответе возвращаются два массива:<br><br>
        `archived` — идентификаторы успешно заархивированных заказов<br><br>
        `failed` — идентификаторы заказов, которые не удалось заархивировать<br><br>
        В `failed` попадают заказы, которые не найдены, недоступны для токена или не могут быть заархивированы в текущем статусе.<br><br>
        Дублирующиеся идентификаторы в массиве `ids` автоматически удаляются.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              example: { "ids": [1,2,3] }
              type: object
              required:
                - ids
              properties:
                ids:
                  description: Идентификаторы заказов на отгрузку
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: integer
                    format: int64
                    minimum: 1
      responses:
        '200':
          description: Ответ
          content:
            application/json:
              schema:
                example: { "archived": [1,2], "failed": [3] }
                type: object
                properties:
                  archived:
                    description: Идентификаторы успешно заархивированных заказов
                    type: array
                    items:
                      type: integer
                      format: int64
                  failed:
                    description: Идентификаторы заказов, которые не удалось заархивировать
                    type: array
                    items:
                      type: integer
                      format: int64
        '401':
          $ref: "#/components/responses/Message"
        '422':
          $ref: "#/components/responses/Message"
        '429':
          $ref: "#/components/responses/Message"
        '500':
          $ref: "#/components/responses/Message"
