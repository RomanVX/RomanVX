                properties:
                  arrival:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: int64
                        description: Идентификатор созданного заказа
                      company_ids:
                        type: array
                        description: Идентификаторы компаний, чьи товары в приёмке
                        items:
                          type: integer
        '401':
          $ref: "#/components/responses/Message"
        '403':
          $ref: "#/components/responses/Message"
        '422':
          $ref: "#/components/responses/Message"
        '429':
          $ref: "#/components/responses/Message"
        '500':
          $ref: "#/components/responses/Message"
  /v1/arrivals/{arrival_id}:
    get:
      tags:
        - Заказы на приемку
      summary: Просмотр заказа на приемку
      description: >
        Метод позволяет получить информацию о заказе на приемку.
      parameters:
        - name: arrival_id
          in: path
          required: true
          schema:
            type: integer
          description: Идентификатор заказа
      responses:
        '200':
          description: >-
            Статус заказа:<br><br>
            `NEW` - новый<br><br>
            `COMPLETED` - завершен<br><br>
            `ARCHIVE` - в архиве<br><br>
          content:
            application/json:
              schema:
                example: { "result": { "id": 1,"to_warehouse_id": 1,"status": "COMPLETED","date": "2021-05-18T21:00:00.000000Z","accepted_at": "2021-05-18T21:00:00.000000Z","created_at": "2021-05-19T09:44:27.000000Z","updated_at": "2023-05-26T10:24:14.000000Z","note": "string","items": [ { "id": 1,"company_id": 7,"quantity": 50,"fact_quantity": 50,"note": "string","product": { "id": 75150,"article": "WD-0434ASH","name": "Доска разделочная торцевая","width": 400,"length": 300,"height": 40,"gross": 1200 },"arrival_item_services": [ { "id": 1,"price": 10,"cost_price": 10,"service": { "id": 1,"name": "Сборка","price_type": "piece_prices","note": "Сборка" } } ] } ],"arrival_services": [ { "id": 1,"price": 10,"cost_price": 10,"count": 1,"service": { "id": 1,"name": "Сборка","price_type": "piece_prices","note": "Сборка" } } ] } }
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: int64
                        description: Идентификатор заказа
                      to_warehouse_id:
                        type: integer
                        format: int64
                        description: Идентификатор склада на который будет принят товар
                      status:
                        type: string
                        description: Статус заказа
                      date:
                        type: string
                        format: date-time
                        description: Ожидаемая дата поступления заказа на склад
                      accepted_at:
                        type: string
                        format: date-time
                        nullable: true
                        description: Дата приемки товара на склад. Равняется null если заказ не принят.
                      created_at:
                        type: string
                        format: date-time
                        description: Дата создания заказа
                      updated_at:
                        type: string
                        format: date-time
                        description: Дата обновления заказа
                      note:
                        type: string
                        nullable: true
                        description: Примечание к заказу
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              format: int64
                              description: Уникальный идентификатор товара в заказе
                            company_id:
                              type: integer
                              format: int64
                              nullable: true
                              description: Идентификатор клиентской компании владельца товара
                            quantity:
                              type: integer
                              description: Ожидаемое кол-во товара
                            fact_quantity:
                              type: integer
                              nullable: true
                              description: Принятое на склад кол-во товара
                            note:
                              type: string
                              nullable: true
                              description: Примечание к товару в заказе
                            product:
                              type: object
                              description: >
                                Товар в каталоге. Если товар удалён (осиротевшая позиция), объект
                                возвращается тем же набором полей, но все они равны `null`.
                              properties:
                                id:
                                  type: integer
                                  format: int64
                                  nullable: true
                                  description: Уникальный идентификатор товара
                                article:
                                  type: string
                                  nullable: true
                                  description: Артикул товара
                                name:
                                  type: string
                                  nullable: true
                                  description: Название товара
                                width:
                                  type: integer
                                  nullable: true
                                  description: >
                                    Ширина в мм. `null` — не заполнено (или товар удалён). У товаров,
                                    созданных через API без габаритов, вместо `null` может лежать `0`
                                    (унаследованное поведение создания товара).
                                length:
                                  type: integer
                                  nullable: true
                                  description: >
                                    Длина в мм. `null` — не заполнено (или товар удалён). У товаров,
                                    созданных через API без габаритов, вместо `null` может лежать `0`
                                    (унаследованное поведение создания товара).
                                height:
                                  type: integer
                                  nullable: true
                                  description: >
