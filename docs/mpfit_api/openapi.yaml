  /v1/analytics/storage/list:
    post:
      tags:
        - Аналитика
      summary: Данные хранения
      description: >
        Метод позволяет получить данные хранения за указанный период.<br><br>
        Для компании с типом «фулфилмент» возвращаются данные по своей компании и своим селлерам.<br><br>
        Для компании с типом «селлер» возвращаются данные только по своей компании.<br><br>
        Если в фильтре указаны `company_ids`, к которым у токена нет доступа, они будут проигнорированы без предупреждения.
      requestBody:
        required: true
        description: >
          `filter.date_from` - начало периода (включительно).<br><br>
          `filter.date_to` - конец периода (включительно). Должна быть больше или равна `filter.date_from`.
        content:
          application/json:
            schema:
              example: { "limit": 200, "last_id": 0, "filter": { "date_from": "2026-01-01", "date_to": "2026-12-31", "company_ids": [ 2 ] } }
              type: object
              required:
                - limit
                - last_id
                - filter
              properties:
                limit:
                  description: Кол-во элементов в ответе
                  type: integer
                  minimum: 1
                  maximum: 200
                last_id:
                  $ref: "#/components/schemas/CursorLastIdRequest"
                filter:
                  type: object
                  required:
                    - date_from
                    - date_to
                  properties:
                    date_from:
                      description: Начало периода (включительно)
                      type: string
                      format: date
                    date_to:
                      description: Конец периода (включительно)
                      type: string
                      format: date
                    company_ids:
                      description: Идентификаторы компаний. Если в массиве будет указан id компании к которой у токена нет доступа, то id будет проигнорирован без предупреждения.
                      type: array
                      items:
                        type: integer
                        format: int64
                        minimum: 1
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                example: { "result": { "data": [ { "id": 8077629, "company_id": 1, "company_name": "ИП ТЕСТ", "service_type_id": 1, "service_type": "по объему товара", "amount": 15000, "date": "2026-02-18" } ], "total": 1, "last_id": 8077629 } }
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      data:
                        type: array
                        description: Список записей хранения
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              format: int64
                              description: Уникальный идентификатор записи
                            company_id:
                              type: integer
                              format: int64
                              description: Идентификатор компании
                            company_name:
                              type: string
                              description: Название компании
                            service_type_id:
                              type: integer
                              format: int64
                              description: Идентификатор типа услуги хранения
                            service_type:
                              type: string
                              description: Название типа услуги хранения
                            amount:
                              type: integer
                              format: int64
                              description: Сумма хранения в копейках.
                            date:
                              type: string
                              format: date
                              description: Дата записи
                      total:
                        type: integer
                        description: Кол-во элементов в свойстве data
                      last_id:
                        $ref: "#/components/schemas/CursorLastIdResponse"
        '401':
          $ref: "#/components/responses/Message"
        '422':
          $ref: "#/components/responses/Message"
        '429':
          $ref: "#/components/responses/Message"
        '500':
