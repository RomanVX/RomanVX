<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заказы · Разработка</title>
  <script>
    const theme = localStorage.getItem('mp_theme') || 'light';
    document.documentElement.dataset.theme = theme;
    document.documentElement.dataset.bsTheme = theme;
  </script>
  <link rel="stylesheet" href="/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/style.css?v=35">
</head>
<body>
  <main class="container-fluid pb-3 px-0">
  <div id="ordersAccessError" class="alert alert-danger" role="alert" hidden></div>
  <div id="pane-salesan">
    <h1 class="h2 fw-bold mb-3">Заказы</h1>
    <div class="d-flex flex-wrap align-items-stretch gap-2 mb-3" id="ordersFilters" hidden>
      <select id="ordersMarketplace" class="form-select form-select-sm development-brand-filter" aria-label="Маркетплейс"></select>
      <select id="ordersBrand" class="form-select form-select-sm development-brand-filter" aria-label="Бренд магазина">
        <option value="">Все бренды</option>
      </select>
      <select id="ordersPeriod" class="form-select form-select-sm development-brand-filter" aria-label="Период">
        <option value="day">День</option>
        <option value="week">Неделя</option>
        <option value="month">Месяц</option>
      </select>
      <input type="date" id="ordersFrom" class="form-control form-control-sm development-brand-filter" aria-label="Дата начала" title="Для недели и месяца задаёт первый период из семи">
      <input type="date" id="ordersTo" class="form-control form-control-sm development-brand-filter" aria-label="Дата окончания" title="Задаёт последний период из семи">
    </div>
    <div id="ordersSummary"></div>
    <div class="d-flex align-items-baseline gap-2 mb-1"><h6 class="mb-0 fw-semibold">Подробно по артикулам</h6></div>
    <details class="ord-legend mb-2" id="ordersLegend">
      <summary class="small text-secondary" style="cursor:pointer" onclick="setTimeout(function(){try{localStorage.setItem('mp_development_ordLegend',document.getElementById('ordersLegend').open?'1':'0')}catch(e){}},0)">Как читать таблицу</summary>
      <div class="small text-secondary mt-1" style="max-width:980px;line-height:1.5">
        В столбцах указаны <b>сумма заказов (₽)</b> и <b>количество заказанных товаров (шт.)</b>.<br>
        Нажмите на строку группы, чтобы увидеть артикулы. Кольца внизу показывают доли групп в сумме заказов.
      </div>
    </details>
    <script>try{var _lg=localStorage.getItem('mp_development_ordLegend');if(_lg==='1'||(_lg===null&&!window.matchMedia('(max-width: 768px)').matches))document.getElementById('ordersLegend').open=true}catch(e){}</script>
    <div class="card border-0 bg-card mb-3" id="ordersWeekCard">
      <div class="card-body p-0">
        <div class="table-responsive" id="ordersTableWrap">
          <table class="table table-sm align-middle mb-0 text-nowrap" id="ordersTable"></table>
        </div>
      </div>
    </div>

  </div><!-- /pane-salesan -->

  </main>
  <script src="/vendor/chart.umd.min.js"></script>
  <script src="/development/orders.js?v=4"></script>
</body>
</html>
